spring.application.name=carsharing

# --- HTTP ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- PostgreSQL (own database) -----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carsharing}
spring.datasource.username=${DB_USER:carsharing}
spring.datasource.password=${DB_PASSWORD:carsharing}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Fail fast when the database is down (default is 30 s): the caller gets a 503 quickly.
spring.datasource.hikari.connection-timeout=3000

# --- RabbitMQ -----------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
# Propagates the W3C trace context (traceparent) in the message headers.
spring.rabbitmq.template.observation-enabled=true

# --- Carsharing settings -----------------------------------------------
# Hold lifetime (ISO-8601 duration). Same 10 minutes as the legacy systems.
carsharing.hold-ttl=${HOLD_TTL:PT10M}
# How often expired holds are released (and the delay before the first run).
carsharing.expiration.interval=${EXPIRATION_INTERVAL:PT15S}
carsharing.expiration.initial-delay=PT30S
# Topic exchange for platform events; routing key = event routing key.
carsharing.events.exchange=${EVENTS_EXCHANGE:mobility.events}

# --- Observability: OpenTelemetry (W3C traceparent in, trace id in logs, spans out via OTLP) ---
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.connect-timeout=1s
management.opentelemetry.tracing.export.otlp.timeout=2s
# Only traces are exported; do not try to ship logs to a collector.
management.otlp.logging.export.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
