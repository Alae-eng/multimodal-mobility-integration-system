# Test profile: in-memory H2 (PostgreSQL mode), no broker, no collector, nothing to start.
spring.datasource.url=jdbc:h2:mem:carsharing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Expiry is driven explicitly by the tests (moving the clock), not by the scheduler.
carsharing.expiration.initial-delay=PT24H
carsharing.expiration.interval=PT24H

# No collector in tests: spans are kept in memory by the test tracer.
management.otlp.tracing.export.enabled=false
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:1/v1/traces
management.tracing.export.otlp.enabled=false
management.tracing.sampling.probability=1.0

# The health endpoint would try to reach RabbitMQ.
management.health.rabbit.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
