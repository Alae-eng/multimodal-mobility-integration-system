# Test profile: in-memory H2 (PostgreSQL mode), no broker, nothing external to start.
spring.datasource.url=jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# The retry job is driven explicitly by the tests (moving the clock), not by a timer.
notifications.retry.initial-delay=PT24H
notifications.retry.interval=PT24H

# No broker in tests: the consumer is not started, events are handed to the service directly.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
management.health.rabbit.enabled=false
