spring.application.name=notifications

# --- HTTP ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- PostgreSQL (own database) -----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DB_USER:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Fail fast when the database is down (default is 30 s): the caller gets a 503 quickly.
spring.datasource.hikari.connection-timeout=3000

# --- RabbitMQ -----------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
# A message that fails is retried a few times (a transient database error), then sent to the
# dead-letter queue instead of being requeued forever and blocking the queue.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

# --- Notifications settings ---------------------------------------------
# Same topic exchange as the other services; this service binds its own queue to the trip events.
notifications.events.exchange=${EVENTS_EXCHANGE:mobility.events}
notifications.queue=notifications.events
notifications.dead-letter-queue=notifications.events.dlq
# Redelivery of notifications that failed or were interrupted (a crash between recording and sending).
notifications.retry.interval=${RETRY_INTERVAL:PT30S}
notifications.retry.initial-delay=PT30S
notifications.retry.min-age=${RETRY_MIN_AGE:PT30S}
notifications.retry.max-attempts=${RETRY_MAX_ATTEMPTS:5}

# --- Actuator -----------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
