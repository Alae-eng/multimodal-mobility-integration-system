# Test profile: in-memory H2 (PostgreSQL mode), no collector, nothing external to start.
spring.datasource.url=jdbc:h2:mem:pricing;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# No collector in tests: spans are kept in memory by the test tracer.
management.otlp.tracing.export.enabled=false
management.tracing.export.otlp.enabled=false
management.tracing.sampling.probability=1.0
