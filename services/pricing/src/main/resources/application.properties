spring.application.name=pricing

# --- HTTP ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- PostgreSQL (own database) -----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pricing}
spring.datasource.username=${DB_USER:pricing}
spring.datasource.password=${DB_PASSWORD:pricing}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Fail fast when the database is down (default is 30 s): the caller gets a 503 quickly.
spring.datasource.hikari.connection-timeout=3000

# Money is always a whole number of centimes: a decimal price must be refused, not truncated.
spring.jackson.deserialization.accept-float-as-int=false

# --- Observability: OpenTelemetry (W3C traceparent in, trace id in logs, spans out via OTLP) ---
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.connect-timeout=1s
management.opentelemetry.tracing.export.otlp.timeout=2s
# Only traces are exported; do not try to ship logs to a collector.
management.otlp.logging.export.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
