# Test profile: in-memory H2 (PostgreSQL mode), no broker, nothing external to start.
spring.datasource.url=jdbc:h2:mem:bookings;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# The schedulers are driven explicitly by the tests (moving the clock), not by timers.
bookings.outbox.initial-delay=PT24H
bookings.outbox.interval=PT24H
bookings.expiration.initial-delay=PT24H
bookings.expiration.interval=PT24H

# The health endpoint would try to reach RabbitMQ.
management.health.rabbit.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
