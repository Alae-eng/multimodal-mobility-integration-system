spring.application.name=bookings

# --- HTTP ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- PostgreSQL (own database) -----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookings}
spring.datasource.username=${DB_USER:bookings}
spring.datasource.password=${DB_PASSWORD:bookings}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Fail fast when the database is down (default is 30 s): the caller gets a 503 quickly.
spring.datasource.hikari.connection-timeout=3000

# Money is always a whole number of centimes: a decimal amount must be refused, not truncated.
spring.jackson.deserialization.accept-float-as-int=false

# --- RabbitMQ -----------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
# The broker acknowledges each event: an event is only marked as sent once it was acknowledged.
spring.rabbitmq.publisher-confirm-type=correlated

# --- Bookings settings --------------------------------------------------
# A PENDING travel file the saga never completed is failed after this long (ISO-8601 duration).
# Longer than the operators' 10-minute holds, which have expired by then.
bookings.pending-ttl=${PENDING_TTL:PT15M}
bookings.expiration.interval=${EXPIRATION_INTERVAL:PT30S}
bookings.expiration.initial-delay=PT30S
# Topic exchange shared by the platform; routing keys are booking.confirmed / booking.cancelled.
bookings.events.exchange=${EVENTS_EXCHANGE:mobility.events}
# Outbox relay: how often pending events are sent to the broker (and the delay before the first run).
bookings.outbox.interval=${OUTBOX_INTERVAL:PT1S}
bookings.outbox.initial-delay=PT5S

# --- Actuator -----------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
