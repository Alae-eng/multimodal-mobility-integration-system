spring:
  application:
    name: air-bridge
server:
  port: 8091
air:
  url: ${AIR_URL:http://air:8080/ws}
  connect-timeout-ms: 3000   # même ordre de grandeur que le rail-bridge
  read-timeout-ms: 5000

# Traçabilité : le traceId (W3C traceparent) apparaît dans chaque ligne de log
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

# Circuit breaker : s'ouvre si >= 50 % d'échecs TECHNIQUES sur 10 appels (min. 5).
# Un refus métier (409) n'est jamais compté comme un échec.
resilience4j:
  circuitbreaker:
    instances:
      air:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        recordExceptions:
          - org.springframework.ws.client.WebServiceIOException
          - ma.mobility.airbridge.soap.UpstreamFailureException
        ignoreExceptions:
          - ma.mobility.airbridge.soap.OperatorRefusedException